evaluation_protocol_as_coded_by_authors:
  split: {function: train_test_split, test_size: 0.2, stratify: target, random_state: 123}
  n_train: 1233
  n_test: 309
  test_class_counts: {target_0: 125, target_1: 184}
  scaling: "StandardScaler fitted on the FULL dataset before the split (Tabular Neural notebook)"
  validation_set: none
  test_set_used_for: [early_stopping, hyperparameter_search_TabNet_Optuna]
  same_test_rows_across_notebooks: >
    Verified: the CGEVC split (6 features) and the Tabular Neural split select
    the same 309 row indices.
  synthetic_rows_in_test: "yes - SMOTE and CTGAN are applied BEFORE the split"

reproduction_criteria:       # FROZEN - copied from P3 section 2.3
  full: "all main scores within 0.02 absolute points of published values, matching protocol"
  partial: "some scores match, or numbers match but a material protocol change limits the claim"
  not_reproduced: "no main score matches, or evaluation is blocked"
  pending: "not yet attempted"
  tolerance_absolute: 0.02
  tolerance_in_test_rows: "about 6 of 309 rows (one row = 0.0032)"
  obstacle_categories: [code, data, method, environment, computational]

reported_scores_in_paper:
  primary_main_score:
    model: TabPFN
    metric: accuracy
    value: 0.90
    source: "Table 5"
  secondary_scores:            # accuracy, Table 5
    TabNet: 0.89
    FT-Transformer: 0.89
    BNN: 0.87
    CGEVC: 0.89
  author_stored_outputs:       # outputs saved inside the author's notebooks (run dated 2025-04-19)
    TabPFN: {accuracy: 0.9029, f1: 0.9202}
    TabNet: {accuracy: 0.8867, f1: 0.9091}
    FT-Transformer: {accuracy: 0.8900}
    BNN: {accuracy: 0.8673}
    CGEVC: {accuracy: 0.8867}

