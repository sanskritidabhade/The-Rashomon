  xgboost: 3.4.1
  lightgbm: 4.6.0
  pip_freeze_file: versiones_colab.txt                # commit versiones_colab.txt

runs:
  - id: R1_TabPFN_current
    model: TabPFN
    tabpfn_package: "9.2.0"
    weights: "tabpfn-v3.5-20260909.safetensors"
    accuracy: 0.9191
    n_correct: 284
    f1_class1: 0.9337
    delta_vs_paper: 0.0191
    deterministic: "yes (2 identical runs)"
    protocol_match: "partial - different model generation than the author's"
    predictions_file: preds_tabpfn_A1.csv
    time_minutes: 240
  - id: R2_TabPFN_v2
    model: TabPFN
    tabpfn_package: 2.0.8               # exact version installed for A2
    weights: 3.5                      # checkpoint file name downloaded
    accuracy: 0.8997
    n_correct: 278
    f1_class1: 0.9178
    delta_vs_paper: 0.0003
    delta_vs_author_stored: 0.0032     # one row
    deterministic: 0.89
    protocol_match: "yes (same generation as author's v2 checkpoint series)"
    predictions_file: preds_tabpfn_A2.csv
    time_minutes: 120
    todo: "fix the 'model' column of the CSV: it wrongly says v9.2.0 / weights v3.5"
  - id: R3_TabNet_author_params
    model: TabNet
    hyperparameters_source: "final cell of Tabular Neural notebook (hard-coded; Optuna NOT re-run)"
    accuracy: 0.8900
    n_correct: 275
    f1_class1: 0.9066
    delta_vs_paper: 0.0001
    delta_vs_author_stored: 0.0033     # one row
    deterministic: "yes (3 identical runs); probably library default seed=0, not verified in source"
    predictions_file: preds_tabnet.csv
    time_minutes: 120
  - id: R4_CGEVC_author_params
    model: CGEVC
    features_used: [exang, slope, fbs, cp, sex, oldpeak]
    accuracy: 0.8835
    n_correct: 273
    precision_class1: 0.8854
    delta_vs_paper: 0.0065
    delta_vs_author_stored: 0.0032     # one row
    predictions_file: preds_cgevc.csv
    time_minutes: 60

runs_not_attempted:
  FT-Transformer: "blocked by environment (rtdl requires torch<2)"
  BNN: "not attempted; 0.03 below the best model, outside the 0.02 similarity rule"

status_proposal:
  value: "reproduced_with_caveats"
  decided_by: "PENDING team cross-review"
  scope: "Evaluation re-run from the author's published augmented CSV; the SMOTE -> CTGAN pipeline was not rebuilt (CTGAN is unseeded, so an identical rebuild is not possible)."
  caveats:
    - "Paper (Table 1: 1016 rows, 4 features) does not match its own code (1542 rows, 11 features)."
    - "Number reproduced does not mean number is valid: leakage (see obstacle log)."
    - "TabPFN agrees with the paper only for a v2-series model; current weights give +0.019."

obstacle_log:
  # category follows P3 taxonomy: code | data | method | environment | computational
  - {id: O1,  category: code,        description: "Repository contains only a README; code lives in Colab notebooks and data in Drive. No commit freezes the code.", time_hours: 0.2 estimated}
  - {id: O2,  category: environment, description: "No pinned versions; every install is a bare pip install.", time_hours: 0.1 estimated}
  - {id: O3,  category: environment, description: "rtdl needs torch<2; incompatible with current Colab (Python 3.13, torch 2.14). FT-Transformer not run.", time_hours: 1 estimated}
  - {id: O4,  category: environment, description: "Current TabPFN requires an account, license acceptance and API token to download weights; author's run needed none.", time_hours: 0.5 estimated}
  - {id: O5,  category: environment, description: "Unpinned tabpfn installs a newer model generation; accuracy changes from 0.8997 (v2) to 0.9191 (v3.5).", time_hours: 0.1 estimated}
  - {id: O6,  category: method,      description: "SMOTE and CTGAN are applied before the train/test split; StandardScaler is fitted before the split; about 40 % of the dataset is synthetic and part of it is in the test set.", time_hours: not_applicable}
  - {id: O7,  category: method,      description: "No validation set. Test rows drive TabNet early stopping and Optuna search (best trial 0.9061 on test).", time_hours: not_applicable}
  - {id: O8,  category: method,      description: "Paper vs code mismatch: Table 1 says 1016 rows and 4 clinical features; code uses 1542 rows and 11 features.", time_hours: not_applicable}
  - {id: O9,  category: method,      description: "Final TabNet cell does not replicate the Optuna best trial (batch_size 48 vs 1024, virtual batch 32 vs 128, no scheduler, early stopping on AUC vs accuracy). Result 0.8867 vs 0.9061.", time_hours: not_applicable}
  - {id: O10, category: method,      description: "CGEVC: ATE and feature selection computed on the full dataset including test rows and the target (leakage). Selection includes oldpeak (ATE 0.0926 < 0.1) and excludes restecg (0.0375); Eq. 7 of the paper describes weighted voting but code uses unweighted soft voting.", time_hours: not_applicable}
  - {id: O11, category: data,        description: "Notebook that produces the SMOTE file is not identified; CTGAN has no seed, so the final CSV cannot be regenerated identically. The author's CSV is required.", time_hours: 0.2 estimated}
  - {id: O12, category: code,        description: "'cvd dataset preparation' notebook does not prepare the dataset (clustering only). Paper-to-notebook mapping had to be reconstructed.", time_hours: 0.5 estimated}

deviations_from_author_notebooks:
  - "CSV path changed from /content/sample_data/ to the actual upload location."
  - "rtdl import and install commented out (O3)."
  - "Optuna cells skipped; hyperparameters taken from the author's hard-coded final TabNet cell."
  - "DoWhy/ATE cells skipped for CGEVC (stored author outputs match the paper's ATE values)."
  - "SHAP, ROC and feature-importance cells skipped (not part of Table 5)."
  - "Cells added to save per-row predictions (row_id, y_true, y_pred, proba_1, model, protocol)."

