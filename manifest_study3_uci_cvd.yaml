manifest_version: "0.1"
manifest_date: "2026-11-09"
registration_note: >
  Reproduction criteria (section "reproduction_criteria") are copied verbatim
  from P3 section 2.3 and were NOT changed after seeing results. This manifest
  was completed AFTER the first runs, because the author's code and data were
  outside the repository and had to be inspected first. Result sections are
  filled from logged runs only.

study:
  id: S3_UCI_CVD_DIAGNOSIS
  paper_ref: "[3]"
  citation: >
    Hasan, K. S., & Dhrubo, I. S. (2026). Advancing cardiovascular disease
    diagnosis with an interpretable and responsible AI framework.
    Scientific Reports, 16, 15452.
  doi: "10.1038/s41598-026-35451-3"
  published_online: "2026-04-02"

outcome_and_cohort:
  outcome: "Presence of heart disease (CVD), binary diagnostic label"
  target_column: target            # 1 = disease, 0 = no disease
  task_type: "clinical diagnostic classification (NOT mortality, NOT risk over a time horizon)"
  population: "UCI Heart Disease data: Cleveland, Hungary, Switzerland, Long Beach VA"
  statlog_handling: "Statlog rows (272) are exact duplicates of Cleveland rows and are removed"
  n_rows_unique: 918
  class_counts_unique: {target_1: 508, target_0: 410}
  features_used_in_table5_code: [age, sex, cp, trestbps, chol, fbs, restecg, thalach, exang, oldpeak, slope]
  features_dropped: [ca, thal]     # missing in 3 of the 4 regional subsets
  stream_audited: >
    Table 5 (neural-model comparison). In the author's code this stream uses
    ALL 11 features, not the "clinical" 4-feature subset described in Table 1.

