  run_date: "2025-04-19"
  python: "3.11"
  numpy: "1.26.4"
  optuna: "4.3.0"
  pinned_versions_provided: false     # all installs are unpinned "pip install"

our_environment:
  platform: "Google Colab (CPU runtime)"
  python: "3.13.18"
  numpy: "2.4.6"
  pandas: "2.2.3"
  scikit_learn: "1.6.1"
