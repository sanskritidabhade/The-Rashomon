    - {file: preds_tabnet.csv,    sha256: 49e7a54de640139e0b33d71f073b0d929dd5325fce71c9b348437c884bd43b46}
    - {file: preds_cgevc.csv,     sha256: 3aeaa2d904be3f77e6e5dfdff5fd830ba06499a86efe28f8790092b85ad5935a}
  alignment_check: "All four files share the same 309 row_id and y_true values (verified)."

rashomon_comparison:        # separate from the reproduction audit (P3 section 2.3)
  status: "preliminary - computed on the leaky author protocol; to be redone in Level C"
  comparable_models: [TabPFN_v2 (R2), TabNet (R3), CGEVC (R4)]
  excluded: ["TabPFN current weights (R1): same family as R2, kept as sensitivity analysis only"]
  similarity_rule_declared: "within 0.02 of the best validation score (accuracy); here applied to test accuracy because no validation set exists"
  accuracy_range: [0.8835, 0.8997]
  label_disagreement: {rows: 33, of: 309, rate: 0.107}
  pairwise_label_disagreement: {TabPFN_vs_TabNet: 23, TabPFN_vs_CGEVC: 15, TabNet_vs_CGEVC: 28}
  all_three_agree_and_wrong: 17
  probability_spread_rule: "NOT reported: probabilities are not calibrated and come from different model families"
  consensus_mean_allowed: false
  reason: "calibration checks (ECE <= 0.10, Brier vs prevalence baseline) not yet run"

next_steps:
